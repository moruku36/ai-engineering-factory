[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-factory"
version = "0.1.0"
description = "Autonomous AI Engineering Factory for multi-agent software development and governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
