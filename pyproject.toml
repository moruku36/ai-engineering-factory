[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-factory"
version = "0.1.0"
description = "Safety-first, repository-centric harness for multi-agent software engineering orchestration and governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[project.urls]
Repository = "https://github.com/moruku36/ai-engineering-factory"
Documentation = "https://github.com/moruku36/ai-engineering-factory#readme"
Issues = "https://github.com/moruku36/ai-engineering-factory/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
